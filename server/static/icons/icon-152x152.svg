<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C85A32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A03C1B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFBF5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  
  <!-- Decorative Pattern -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2">
    <circle cx="256" cy="256" r="200"/>
    <circle cx="256" cy="256" r="180"/>
    <circle cx="256" cy="256" r="160"/>
  </g>
  
  <!-- Book Icon -->
  <g transform="translate(256, 256)">
    <!-- Book Shape -->
    <path d="M-80,-100 L-80,100 C-80,110 -70,120 -60,120 L60,120 C70,120 80,110 80,100 L80,-100 C80,-110 70,-120 60,-120 L-60,-120 C-70,-120 -80,-110 -80,-100 Z" 
          fill="url(#book)"/>
    
    <!-- Book Spine -->
    <path d="M-10,-100 L-10,120" stroke="#C85A32" stroke-width="4" stroke-opacity="0.3"/>
    
    <!-- Page Lines -->
    <g stroke="#C85A32" stroke-opacity="0.2" stroke-width="2">
      <line x1="-60" y1="-80" x2="-20" y2="-80"/>
      <line x1="-60" y1="-60" x2="-20" y2="-60"/>
      <line x1="-60" y1="-40" x2="-20" y2="-40"/>
      <line x1="-60" y1="-20" x2="-20" y2="-20"/>
      <line x1="-60" y1="0" x2="-20" y2="0"/>
      <line x1="-60" y1="20" x2="-20" y2="20"/>
      <line x1="-60" y1="40" x2="-20" y2="40"/>
      <line x1="-60" y1="60" x2="-20" y2="60"/>
      <line x1="-60" y1="80" x2="-20" y2="80"/>
    </g>
    
    <!-- Text Lines -->
    <g stroke="#C85A32" stroke-opacity="0.2" stroke-width="2">
      <line x1="10" y1="-80" x2="60" y2="-80"/>
      <line x1="10" y1="-60" x2="60" y2="-60"/>
      <line x1="10" y1="-40" x2="60" y2="-40"/>
      <line x1="10" y1="-20" x2="60" y2="-20"/>
      <line x1="10" y1="0" x2="60" y2="0"/>
      <line x1="10" y1="20" x2="60" y2="20"/>
      <line x1="10" y1="40" x2="60" y2="40"/>
      <line x1="10" y1="60" x2="60" y2="60"/>
      <line x1="10" y1="80" x2="60" y2="80"/>
    </g>
  </g>
  
  <!-- Decorative Corners -->
  <g fill="#D99B26">
    <circle cx="256" cy="120" r="8"/>
    <circle cx="256" cy="392" r="8"/>
    <circle cx="120" cy="256" r="8"/>
    <circle cx="392" cy="256" r="8"/>
  </g>
</svg>
